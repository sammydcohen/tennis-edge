[project]
name = "tennis-edge"
version = "0.1.0"
description = "ATP/WTA match prediction and betting-value engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.1",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "streamlit>=1.39",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
